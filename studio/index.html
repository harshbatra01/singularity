<style>
/* Layout: a platinum wall lit from above like the platinum logo (canvas-rendered light, fine grain) with a 3D wheel of five service zones; spin sideways, zoom into the lit zone to open a loose, board-style page for it. Single theme by brief. */
:root{
  --night:#e9e8e4;      /* platinum ground */
  --coal:#fcfcfb;       /* card: pearl white */
  --coal-2:#efeeeb;
  --rust:#a9a8a4;
  --ember:#d0192f;      /* roulette red: the colour that pops */
  --cream:#121214;      /* text */
  --paper:var(--coal);
  --ink:var(--cream);
  --muted:#6c6b70;
  --line:rgba(18,18,20,.12);
  --felt:var(--coal-2);
  --red:#d0192f;
  --pblack:#0b0b0c;
  --y:#ffe27a; --p:#ffc6d1; --m:#bdeedb; --b:#c9dcff;   /* sticky notes in full colour */
  --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --hand:"Caveat","Bradley Hand","Comic Sans MS",cursive;
  --body:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
button:focus-visible,a:focus-visible,.panel:focus-visible{outline:2px solid var(--red);outline-offset:3px}

.app{position:relative;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding-inline:clamp(16px,3vw,40px)}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:clamp(14px,2.4vh,24px) 4px;z-index:5}
.brand{font-family:var(--display);font-weight:800;font-size:clamp(1.1rem,2vw,1.4rem);letter-spacing:-.025em;line-height:1.1}
.brand small{display:block;font-family:var(--mono);font-weight:400;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.cta{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;border-radius:999px;padding:10px 16px;font-family:var(--mono);font-size:.72rem;letter-spacing:.04em;white-space:nowrap}

/* Stage */
.viewport{position:relative;overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;margin-inline:calc(-1 * clamp(16px,3vw,40px))}
.viewport.dragging{cursor:grabbing}
.spot{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 32% 55% at 50% 46%, rgba(255,236,200,.55), rgba(255,255,255,0) 70%)}
.camera{position:absolute;left:50%;top:47%;width:0;height:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.ring{position:absolute;transform-style:preserve-3d}
.floor{position:absolute;left:0;top:0;border-radius:50%;background:radial-gradient(closest-side, rgba(22,23,26,.16), rgba(22,23,26,.05) 60%, rgba(22,23,26,0))}
.floor::after{content:"";position:absolute;inset:18%;border-radius:50%;border:1px dashed rgba(22,23,26,.18)}
.hintline{position:absolute;left:0;right:0;bottom:clamp(4px,1.5vh,14px);text-align:center;font-family:var(--hand);font-size:clamp(1.05rem,1.6vw,1.3rem);color:var(--muted);pointer-events:none}

.panel{position:absolute;left:0;top:0;background:var(--paper);border:1px solid var(--line);border-radius:.9em;overflow:hidden;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;
  box-shadow:0 2em 3.6em -1.8em rgba(22,23,26,var(--sh,.2))}
.panel .shade{position:absolute;inset:0;background:#0d0e10;pointer-events:none;opacity:var(--dark,0)}
.panel .glow{position:absolute;inset:-1px;border-radius:.9em;pointer-events:none;box-shadow:inset 0 0 0 2px var(--edge,var(--red)), 0 0 3.5em rgba(255,214,150,.6);opacity:var(--lit,0)}
.pocket{display:flex;align-items:center;justify-content:space-between;padding:1.1em 1.2em 0}
.chip{font-family:var(--mono);font-size:.72rem;font-weight:600;color:#fff;padding:4px 9px;border-radius:999px;display:inline-block}
.panel .chip{font-size:.72em;padding:.35em .75em}
.chip.red{background:var(--red);color:#fff} .chip.black{background:var(--ink)}
.pocket .idx{font-family:var(--mono);font-size:.66em;color:var(--muted);letter-spacing:.1em}
.panel h2{font-family:var(--display);font-weight:800;letter-spacing:-.035em;line-height:.95;margin:.75em 1.2em .45em .85em;font-size:2em;text-wrap:balance}
.panel p{margin:0 1.2em;color:var(--muted);font-size:.88em;line-height:1.45}
.panel .key{margin:.8em 1.2em 0;font-family:var(--hand);font-size:1.4em;color:var(--red);line-height:1}
.thumb{margin:auto 1.2em 1.2em;aspect-ratio:16/9;max-width:100%;border-radius:.6em;position:relative;overflow:hidden;background:var(--felt);flex:none}
.thumb canvas{width:100%;height:100%;display:block}
.thumb .play{position:absolute;left:.7em;bottom:.6em;font-family:var(--mono);font-size:.64em;background:rgba(255,255,255,.92);padding:.3em .6em;border-radius:999px}

/* Footer: music on the left, wheel controls on the right */
.hud{display:flex;align-items:center;justify-content:center;gap:12px 20px;flex-wrap:wrap;padding-block:6px clamp(14px,2.4vh,22px);min-height:52px;z-index:5}
.dial{display:flex;gap:6px}
.dial button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--paper);font-family:var(--mono);font-size:.7rem;font-weight:600;transition:transform .2s}
.dial button.on{color:#fff;transform:translateY(-3px)}
.dial button.on.red{background:var(--red);border-color:var(--red);color:#fff}
.dial button.on.black{background:var(--ink);border-color:var(--ink)}
.group{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.group button{border:0;background:transparent;padding:8px 12px;font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase}
.group button.on{background:var(--ink);color:#fff}
.group button+button{border-left:1px solid var(--line)}
.label{font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ctl{display:flex;align-items:center;gap:8px}

/* Music player (stays put while you move around the site) */
.music{position:fixed;z-index:40;left:clamp(16px,3vw,40px);bottom:calc(clamp(12px,2vh,20px) + env(safe-area-inset-bottom,0px));
  display:inline-flex;align-items:center;gap:10px;padding:0 6px 0 12px;height:36px;border-radius:7px;color:#fff;
  background:rgba(42,43,46,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.eq{display:flex;align-items:flex-end;gap:2.5px;height:12px;flex:none}
.eq i{width:2.5px;background:#fff;height:100%;transform-origin:bottom}
.eq i:nth-child(2){height:68%} .eq i:nth-child(3){height:58%}
.music.playing .eq i{height:100%;animation:eqa .24s ease-in-out infinite alternate}
.music.playing .eq i:nth-child(2){animation-name:eqb;animation-duration:.19s}
.music.playing .eq i:nth-child(3){animation-name:eqc;animation-duration:.27s}
@keyframes eqa{0%{transform:scaleY(.35)}50%{transform:scaleY(1)}100%{transform:scaleY(.6)}}
@keyframes eqb{0%{transform:scaleY(.9)}50%{transform:scaleY(.25)}100%{transform:scaleY(.75)}}
@keyframes eqc{0%{transform:scaleY(.5)}50%{transform:scaleY(.95)}100%{transform:scaleY(.3)}}
.mmeta{font-family:var(--mono)}
.mmeta b{display:block;font-weight:400;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#f2f2f3}
.mbtn{flex:none;width:26px;height:26px;border:0;border-radius:8px;background:transparent;display:grid;place-items:center;color:#fff;padding:0}
.mbtn svg{width:15px;height:15px;fill:currentColor}
.mbtn:hover{background:rgba(255,255,255,.08)}




/* Hover: card jitters, casino chips spill from the cursor */
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:8}
.fx.front{z-index:35}
.fx.clear{opacity:0;transition:opacity .14s ease}
.fx .c{position:absolute;left:0;top:0}
.fx .c svg{display:block;width:100%;height:100%}


/* ---------- Expanded zone: a loose board ---------- */
.detail{position:fixed;inset:0;z-index:20;overflow-y:auto;overscroll-behavior:contain;
  background-color:var(--paper);background-image:radial-gradient(circle, #d9d7de 1px, transparent 1.2px);background-size:22px 22px;
  opacity:0;transform:scale(.72);transform-origin:50% 45%;pointer-events:none;transition:opacity .45s ease, transform .6s cubic-bezier(.2,.8,.2,1)}
.detail.open{opacity:1;transform:none;pointer-events:auto}
.dtop{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:12px;padding-inline:clamp(16px,3vw,40px);padding-block:calc(12px + env(safe-area-inset-top,0px)) 12px;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.back{border:1px solid var(--ink);background:var(--paper);border-radius:999px;padding:8px 14px;font-family:var(--mono);font-size:.72rem;letter-spacing:.05em}
.dtop .r{display:flex;align-items:center;gap:10px}

.boardx{max-width:1120px;margin:0 auto;padding-inline:clamp(16px,3vw,40px);padding-block:36px 120px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:30px 22px;align-items:start}
.it{grid-column:var(--c,span 12);transform:translate(var(--dx,0),var(--dy,0)) rotate(var(--r,0deg));min-width:0;position:relative}
.t-title .tag{margin-bottom:14px}
.t-title h1{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,8.5vw,5.8rem);letter-spacing:-.05em;line-height:.88;margin:0;text-wrap:balance}
.t-lead{font-size:1.1rem;line-height:1.5;max-width:46ch}
.t-note{font-family:var(--hand);font-size:clamp(1.4rem,3vw,1.9rem);line-height:1.1;color:var(--ink)}
.t-note.red{color:var(--red)}
.sticky{padding:18px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;font-size:1.02rem;line-height:1.35;
  box-shadow:0 12px 20px -10px rgba(22,23,26,.28)}
.sticky b{font-family:var(--display);font-size:1.35rem;letter-spacing:-.02em;line-height:1.05;display:block}
.sticky .sn{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;color:rgba(22,23,26,.6)}
.reel .scr{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--ink);box-shadow:0 18px 34px -16px rgba(22,23,26,.45);max-width:100%}
.reel canvas,.tile canvas{width:100%;height:100%;display:block}
.reel .ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:16px;color:#fff;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.55))}
.reel .ov small{font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.reel .ov b{font-family:var(--display);font-size:clamp(1.3rem,3vw,2rem);letter-spacing:-.03em;line-height:1}
.reel .watch{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--ink);text-decoration:none;border-radius:999px;padding:8px 14px;font-family:var(--mono);font-size:.72rem}
.cap{font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-top:10px;line-height:1.5}
.cap a{color:var(--ink)}
.big b{display:block;font-family:var(--display);font-weight:800;font-size:clamp(3.4rem,10vw,6.6rem);letter-spacing:-.06em;line-height:.85;font-variant-numeric:tabular-nums}
.big span{font-family:var(--hand);font-size:1.7rem;color:var(--red)}
.brands{border:2px solid var(--ink);border-radius:18px;padding:20px;background:var(--paper)}
.brands h4,.box h4{font-family:var(--mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;font-weight:600}
.brands ul{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-wrap:wrap;gap:4px 14px}
.brands li{font-family:var(--display);font-weight:800;font-size:clamp(1.3rem,3vw,1.9rem);letter-spacing:-.03em}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{display:inline-block;border:1px solid var(--ink);border-radius:999px;padding:7px 12px;text-decoration:none;font-family:var(--mono);font-size:.72rem;background:var(--paper)}
.links a:hover{background:var(--ink);color:#fff}
.tile{display:block;text-decoration:none}
.tile .art{aspect-ratio:4/5;border-radius:12px;overflow:hidden;background:var(--felt);max-width:100%;box-shadow:0 12px 22px -14px rgba(22,23,26,.4)}
.tile b{display:block;font-family:var(--display);font-size:1.2rem;margin-top:10px;letter-spacing:-.02em}
.tile span{font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.result{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 14px 26px -18px rgba(22,23,26,.35)}
.result .who{font-family:var(--display);font-weight:800;font-size:1.3rem;letter-spacing:-.02em}
.result .role{font-family:var(--mono);font-size:.68rem;color:var(--muted);margin-top:2px}
.result .jump{display:flex;align-items:baseline;gap:10px;margin:16px 0 4px;flex-wrap:wrap}
.result .jump s{font-family:var(--display);font-size:1.5rem;color:var(--muted);text-decoration:none}
.result .jump b{font-family:var(--display);font-weight:800;font-size:2.4rem;letter-spacing:-.04em;line-height:1}
.result .jump i{font-family:var(--hand);font-style:normal;font-size:1.6rem;color:var(--red)}
.result .when{font-family:var(--hand);font-size:1.35rem;color:var(--ink)}
.result a{display:inline-block;margin-top:10px;font-family:var(--mono);font-size:.7rem}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 4px}
.flow .node{border:2px solid var(--ink);border-radius:12px;padding:10px 14px;font-family:var(--display);font-weight:700;background:var(--paper);letter-spacing:-.01em}
.flow .node.hot{background:var(--ink);color:#fff}
.flow svg{flex:none}
.box{border:2px dashed rgba(22,23,26,.35);border-radius:18px;padding:20px;background:rgba(255,255,255,.85)}
.proc{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.proc span{font-family:var(--body);font-size:.88rem;padding:8px 10px;border-radius:4px;box-shadow:0 8px 14px -8px rgba(22,23,26,.3)}
.proc em{font-family:var(--mono);font-style:normal;font-size:.62rem;color:rgba(22,23,26,.55);margin-right:6px}
.contact{background:var(--ink);color:#fff;border-radius:22px;padding:26px}
.contact h3{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,4.5vw,2.8rem);letter-spacing:-.04em;line-height:.95;margin:0 0 16px}
.contact .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.contact a{display:inline-block;background:#fff;color:var(--ink);text-decoration:none;border-radius:999px;padding:10px 16px;font-family:var(--mono);font-size:.76rem}
.contact a.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5)}
.contact .num{font-family:var(--mono);font-size:.8rem;opacity:.8;user-select:all;-webkit-user-select:all}
.dnav{grid-column:1 / -1;display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:18px}
.dnav button{border:0;background:none;font-family:var(--display);font-weight:700;font-size:1.1rem;letter-spacing:-.02em;text-align:left}
.dnav button:last-child{text-align:right}
.dnav small{display:block;font-family:var(--mono);font-weight:400;font-size:.62rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}

@media (max-width:760px){
  .boardx{grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 14px}
  .it{grid-column:span 2 !important;translate:none}
  .it{transform:rotate(var(--r,0deg))}
  .it.half{grid-column:span 1 !important}
}
@media (max-width:900px){
  .hud{justify-content:center;padding-left:0;padding-bottom:calc(56px + env(safe-area-inset-bottom,0px))}
  .music{left:50%;transform:translateX(-50%)}
  .hud{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:420px){ .label{display:none} .group button{padding:8px 10px} .brand small{display:none} }
@media (max-height:520px) and (min-width:600px){
  .hud{padding-bottom:10px} .hintline{display:none}
}
@media (prefers-reduced-motion:reduce){ .detail,.camera{transition:none} .music.playing .eq i{animation-duration:.6s} }

/* ================= Sand theme ================= */
html{background:var(--night)}
body{background:var(--night);color:var(--cream)}
#sandbg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;pointer-events:none}
.app{z-index:1;transition:opacity .45s ease}
body.zone-open .app{opacity:0;pointer-events:none}
button:focus-visible,a:focus-visible,.panel:focus-visible{outline-color:var(--ember)}

.brand small,.hintline{color:var(--muted)}
.cta{background:var(--cream);color:var(--night);transition:background .2s}
.cta:hover{background:var(--ember)}
.spot{background:radial-gradient(ellipse 30% 46% at 50% 50%, rgba(255,255,255,.06), rgba(255,255,255,0) 70%)}
.floor{background:radial-gradient(closest-side, rgba(255,255,255,.26), rgba(255,255,255,.08) 55%, rgba(255,255,255,0))}
.floor::after{border-color:rgba(18,18,20,.14)}

.panel{background:var(--grain-tile),var(--coal);border-color:var(--line);box-shadow:0 2.2em 3.4em -1.4em rgba(0,0,0,calc(var(--sh,.2)*2.8))}
.panel .shade{background:#040302}
.panel .glow{box-shadow:inset 0 0 0 1px var(--ring,transparent), inset 0 0 0 3px var(--edge,var(--red)), 0 0 3.2em rgba(255,255,255,.38)}
.panel p{color:var(--muted)}
.panel .key{color:var(--ember)}
.thumb{background:var(--coal-2)}
.thumb .play{background:rgba(255,255,255,.78);color:var(--cream);border:1px solid var(--line)}
.chip.black{background:var(--pblack);box-shadow:inset 0 0 0 1px rgba(18,18,20,.55)}

.dial button{background:rgba(255,255,255,.8);border-color:var(--line);color:var(--cream)}
.dial button.on.black{background:var(--pblack);border-color:var(--cream)}
.music{background:rgba(255,255,255,.86);border:1px solid var(--line)}
.nudge{color:var(--ember)}
.nudge:hover{color:var(--cream)}

/* zone pages sit straight on the sand */
.detail{background:linear-gradient(180deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,.15) 45%, rgba(255,255,255,0) 70%);background-color:transparent}
.dtop{background:rgba(255,255,255,.72);border-bottom-color:var(--line)}
.back{background:transparent;color:var(--cream);border-color:rgba(18,18,20,.5)}
.sticky,.proc span{color:#121213}
.sticky .sn,.proc em{color:rgba(18,18,19,.55)}
.t-note.red,.big span,.result .jump i{color:var(--ember)}
.reel .scr{background:var(--night);box-shadow:0 18px 34px -16px rgba(0,0,0,.8)}
.reel .watch{background:var(--cream);color:var(--night)}
.brands{background:rgba(255,255,255,.78);border-color:rgba(18,18,20,.55)}
.links a{background:rgba(255,255,255,.78);border-color:rgba(18,18,20,.4)}
.links a:hover{background:var(--ember);border-color:var(--ember);color:var(--night)}
.tile .art{background:var(--coal-2);box-shadow:0 12px 22px -14px rgba(0,0,0,.8)}
.result{background:var(--grain-tile),var(--coal);box-shadow:0 14px 26px -18px rgba(0,0,0,.8)}
.flow{color:var(--cream)}
.flow .node{background:rgba(255,255,255,.85);border-color:rgba(18,18,20,.6)}
.flow .node.hot{background:var(--ember);border-color:var(--ember);color:var(--night)}
.box{background:rgba(255,255,255,.72);border-color:rgba(18,18,20,.22)}
.contact{background:var(--ember);color:var(--night)}
.contact a{background:var(--night);color:var(--cream)}
.contact a.ghost{background:transparent;color:var(--night);border-color:rgba(255,255,255,.45)}

/* ===== Spotlight demo ===== */
#light{position:fixed;left:0;top:0;z-index:0;pointer-events:none;mix-blend-mode:screen}
body.zone-open #light{opacity:0}
.panel::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 3px 0 0 rgba(120,120,126,calc(var(--rimL,0)*.95)), inset -3px 0 0 rgba(120,120,126,calc(var(--rimR,0)*.95)),
             inset 2.6em 0 2.6em -2.2em rgba(120,120,126,calc(var(--rimL,0)*.5)), inset -2.6em 0 2.6em -2.2em rgba(120,120,126,calc(var(--rimR,0)*.5))}
html.l-shadow .floor{background:radial-gradient(closest-side, rgba(0,0,0,.62) 0%, rgba(0,0,0,.42) 38%, rgba(255,255,255,.2) 60%, rgba(255,255,255,0) 100%)}

.brand{display:flex;align-items:center;gap:12px}
.viewport{-webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(180deg,#000 calc(100% - 28px),transparent)}
.mark{width:38px;height:38px;border-radius:9px;display:block;box-shadow:0 0 0 1px var(--line), 0 10px 24px -10px rgba(0,0,0,.8)}

/* ===== Light platinum overrides ===== */
#light{mix-blend-mode:normal}
.panel{box-shadow:0 2em 3.4em -1.6em rgba(40,40,46,calc(var(--sh,.2)*1.5))}
.panel .shade{background:#76757a}
.panel .glow{box-shadow:inset 0 0 0 1px var(--ring,transparent), inset 0 0 0 3px var(--edge,var(--red)), 0 1.6em 3em -1em rgba(208,25,47,.28)}
html.l-shadow .floor{background:radial-gradient(closest-side, rgba(40,40,46,.30) 0%, rgba(40,40,46,.18) 40%, rgba(255,255,255,.35) 62%, rgba(255,255,255,0) 100%)}
.music{background:rgba(32,32,35,.9);border-color:rgba(255,255,255,.08);color:#fff}
.reel .ov{background:linear-gradient(180deg,rgba(0,0,0,.28),rgba(0,0,0,.62))}
.reel .watch{background:#fff;color:#121214}
.contact{color:#fff}
.contact a{background:#fff;color:#121214}
.contact a.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}
.links a:hover,.flow .node.hot{color:#fff}
.cta{color:#fff}
.cta:hover{background:var(--ember);color:#fff}
.mark{width:34px;height:auto;aspect-ratio:140/158;border-radius:0;box-shadow:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}

/* ===== Responsive pass (all screens) ===== */
body.zone-open .nudge{opacity:0;pointer-events:none}
.app{transition:opacity .45s ease, visibility 0s linear 0s}
body.zone-open .app{visibility:hidden;transition:opacity .45s ease, visibility 0s linear .5s}
.detail{overflow-x:hidden}
.cta,.back{white-space:nowrap}
@media (max-width:440px){ .long{display:none} .brand{font-size:1.05rem} .dtop .r{gap:6px} }
@media (max-width:760px){ .boardx{padding-block:24px 140px} .t-title h1{font-size:clamp(2.4rem,12vw,3.4rem)} .sticky{min-height:0} .contact{padding:20px} .contact .row a{flex:1 1 auto;text-align:center} }
@media (max-width:900px){ .music,.dtop,.dial button{backdrop-filter:none;-webkit-backdrop-filter:none} }
/* landscape phones: put the player back in the corner, keep the wheel big */
@media (max-height:520px){
  .top{padding-block:8px 0} .hintline{display:none}
  .hud{padding-bottom:10px;padding-top:2px;min-height:44px;justify-content:flex-end}
  .music{left:clamp(16px,3vw,40px);transform:none}
  .dial button{width:30px;height:30px}
}

/* ===== Song pill: reference typeface + one scribble that holds its place on every screen ===== */
.mmeta b{font-family:ui-monospace,"SF Mono","IBM Plex Mono",Menlo,Consolas,monospace;font-weight:500;letter-spacing:.03em;font-size:.72rem}
.music .nudge{position:absolute;right:2px;left:auto;bottom:calc(100% + 2px);top:auto;transform:none;display:flex;flex-direction:row;align-items:flex-start;gap:0;
  border:0;background:none;padding:0;color:var(--ember,var(--red));font-family:var(--hand);font-size:1.3rem;line-height:1;white-space:nowrap;
  animation:nudgeBob 1.6s ease-in-out infinite;transition:opacity .35s ease}
.music .nudge span{display:inline-block;transform:rotate(-5deg);padding:0;margin-top:2px}
.music .nudge svg{width:26px;height:26px;flex:none;overflow:visible;transform:none;margin:4px 0 0 2px}
.music .nudge:hover{color:var(--ink)}
@keyframes nudgeBob{0%,100%{translate:0 0}50%{translate:0 -3px}}
.music.playing .nudge,.music.played .nudge,body.zone-open .music .nudge{opacity:0;transform:none;pointer-events:none}
@media (prefers-reduced-motion:reduce){ .music .nudge{animation:none} }

/* ===== Hint line lives in the footer flow, so it never overlaps the wheel ===== */
.hud .hintline{position:static;flex-basis:100%;order:-1;margin:0 0 2px;line-height:1.1}
.hud{row-gap:8px}

/* sticky notes hug their text: label, then the line, then any note, with no dead space */
.sticky{min-height:0;justify-content:flex-start;gap:10px;padding:18px 20px 20px}
.sticky .sn{margin-bottom:2px}

/* ===== Home card bottom: no previews here (they live inside the zones). Four options, switchable. ===== */
.cfoot{margin:1.1em 1.2em 1.2em;position:relative;flex:none}
.cfoot>*{display:none}
html[data-foot="sheen"] .cfoot{aspect-ratio:16/9;border-radius:.6em;overflow:hidden}
html[data-foot="sheen"] .f-sheen{display:block;position:absolute;inset:0;
  background:var(--grain-tile),linear-gradient(125deg,#fbfbfa 0%,#e4e3df 28%,#f6f5f2 46%,#cfcdc8 72%,#efeeea 100%)}
html[data-foot="number"] .f-num{display:block;font-family:var(--display);font-weight:800;font-size:7.4em;line-height:.8;letter-spacing:-.06em;text-align:right;
  color:transparent;-webkit-text-stroke:.03em currentColor}
.f-num.red{color:#d0192f}.f-num.black{color:#121214}
html[data-foot="number"] .f-num{color:transparent}
html[data-foot="number"] .f-num.red{-webkit-text-stroke-color:#d0192f}
html[data-foot="number"] .f-num.black{-webkit-text-stroke-color:#121214}
html[data-foot="list"] .f-list{display:flex;flex-direction:column;gap:.5em;list-style:none;margin:0;padding:.9em 0 0;border-top:1px solid var(--line)}
.f-list li{font-family:var(--mono);font-size:.68em;letter-spacing:.04em;text-transform:uppercase;color:#3d3c41;display:flex;align-items:center;gap:.6em}
.f-list li::before{content:"";width:.45em;height:.45em;border-radius:50%;background:#d0192f;flex:none}
html[data-foot="none"] .f-open{display:flex;justify-content:space-between;align-items:center;padding-top:.8em;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:.66em;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.f-open span{font-size:1.4em;color:#d0192f}
.fdemo{position:fixed;z-index:45;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:4px;
  padding:4px;border-radius:999px;background:rgba(255,255,255,.86);border:1px solid var(--line);backdrop-filter:blur(8px);
  font-family:var(--mono);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;max-width:calc(100vw - 32px);overflow-x:auto;scrollbar-width:none}
.fdemo::-webkit-scrollbar{display:none}
.fdemo span{color:var(--muted);padding:0 6px 0 8px;white-space:nowrap}
.fdemo button{border:0;background:transparent;color:#121214;padding:6px 10px;border-radius:999px;font:inherit;letter-spacing:inherit;text-transform:inherit;white-space:nowrap}
.fdemo button.on{background:#121214;color:#fff}
body.zone-open .fdemo{display:none}

/* ===== Header: never wraps or crowds ===== */
.brand small{white-space:nowrap}
.top{gap:12px}
.brand{min-width:0}
@media (max-width:900px){ .brand small{display:none} }
@media (max-width:720px){ .long{display:none} }
/* ===== About ===== */
.topr2{display:flex;align-items:center;gap:8px}
.about-btn{border:1px solid rgba(18,18,20,.35);background:rgba(255,255,255,.55);border-radius:999px;padding:9px 14px;font-family:var(--mono);font-size:.72rem;letter-spacing:.04em;color:#121214;white-space:nowrap}
.about-btn:hover{background:#121214;color:#fff;border-color:#121214}
.ab-name h1{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,8.5vw,5.6rem);letter-spacing:-.05em;line-height:.88;margin:0;text-wrap:balance}
.ab-role{font-family:var(--mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:12px}
.ab-card{background:var(--grain-tile),#fcfcfb;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 18px 30px -22px rgba(30,30,36,.5)}
.ab-card h4{font-family:var(--mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 14px;font-weight:600}
.ab-rows{display:grid;gap:14px}
.ab-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.ab-row:last-child{border-bottom:0;padding-bottom:0}
.ab-row .k{font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);width:100%}
.ab-row .v{font-family:var(--display);font-weight:700;font-size:clamp(1.05rem,2.6vw,1.35rem);letter-spacing:-.02em;user-select:all;-webkit-user-select:all;min-width:0;overflow-wrap:anywhere}
.ab-row .acts{display:flex;gap:6px;flex-wrap:wrap}
.ab-row .acts a,.ab-row .acts button{border:1px solid rgba(18,18,20,.35);background:transparent;border-radius:999px;padding:7px 12px;font-family:var(--mono);font-size:.7rem;color:#121214;text-decoration:none;white-space:nowrap}
.ab-row .acts a:hover,.ab-row .acts button:hover{background:#121214;color:#fff;border-color:#121214}
.ab-row .acts .done{background:#d0192f;border-color:#d0192f;color:#fff}
.ab-save{display:inline-flex;align-items:center;gap:10px;background:#121214;color:#fff;text-decoration:none;border-radius:999px;padding:12px 18px;font-family:var(--mono);font-size:.76rem;letter-spacing:.03em}
.ab-save:hover{background:#d0192f}
.ab-svc{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.ab-svc li{display:flex;gap:12px;align-items:center;font-size:1rem;line-height:1.4}
.ab-svc li::before{content:"";width:6px;height:6px;border-radius:50%;background:#d0192f;flex:none}
.ab-svc li b{font-family:var(--mono);font-size:.68rem;color:#d0192f;font-weight:600;flex:none}
.ab-partners{font-family:var(--mono);font-size:.72rem;color:var(--muted);line-height:1.7}
@media (max-width:440px){
  .top{gap:8px}
  .brand{gap:8px}
  .mark{width:26px}
  .bname{font-size:.98rem;line-height:1.02;letter-spacing:-.02em}
  .bname span{display:block}                 /* name stacks on two short lines so it always fits */
  .about-btn,.top .cta{padding:8px 11px;font-size:.68rem}
  .topr2{gap:6px}
}
@media (max-width:350px){ .about-btn,.top .cta{padding:7px 9px;font-size:.64rem;letter-spacing:.02em} .bname{font-size:.92rem} .mark{width:24px} }

/* phones: on zone and About pages the player shrinks to a small corner button so it never covers content */
@media (max-width:900px){
  body.zone-open .music{left:auto;right:16px;transform:none;padding:0 4px 0 10px}
  body.zone-open .music .mmeta{display:none}
}

/* ===== Industry cards: three treatments (no photos available) ===== */
.tile .art{position:relative;container-type:inline-size}
.tile .art canvas{display:none}
.tc-cover,.tc-type{display:none;position:absolute;inset:0}
.tile .tc-go{font-style:normal}
/* 1 · designed covers */
html[data-tile="cover"] .tile .art{background:var(--grain-tile),linear-gradient(150deg,#fbfbfa 0%,#e6e5e1 40%,#f4f3f0 62%,#d3d1cc 100%)}
html[data-tile="cover"] .tc-cover{display:flex;flex-direction:column;align-items:center;justify-content:center}
.tc-cover svg{width:42%;height:auto;fill:none;stroke:#141416;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tile .tc-no{position:absolute;left:8%;top:6%;font-family:var(--mono);font-size:max(10px,6cqw);color:#7a797e;letter-spacing:.08em}
.tile .tc-watch{position:absolute;left:8%;bottom:7%;font-family:var(--mono);font-size:max(10px,5.6cqw);letter-spacing:.06em;text-transform:uppercase;color:#d0192f}
html[data-tile="cover"] .tile:hover .tc-cover svg{stroke:#d0192f}
/* 2 · link tiles */
html[data-tile="link"] .tile .art{display:none}
html[data-tile="link"] .tile{background:rgba(255,255,255,.75);border:1px solid rgba(18,18,20,.18);border-radius:14px;padding:16px 18px;box-shadow:0 10px 20px -16px rgba(0,0,0,.4)}
html[data-tile="link"] .tile b{margin:0;display:flex;justify-content:space-between;align-items:center;gap:10px}
html[data-tile="link"] .tile .tc-go{color:#d0192f}
html[data-tile="link"] .tile:hover{background:#121214;color:#fff}
html[data-tile="link"] .tile:hover span{color:#bdbcc1}
/* 3 · big type */
html[data-tile="type"] .tile .art{background:var(--grain-tile),#e3e2df}
html[data-tile="type"] .tc-type{display:block}
.tile .tc-big{position:absolute;left:7%;right:6%;bottom:6%;font-family:var(--display);font-weight:800;font-size:15cqw;line-height:.86;letter-spacing:-.05em;color:#141414;overflow-wrap:anywhere}
.tile .tc-arr{position:absolute;right:7%;top:5%;font-size:13cqw;line-height:1;color:#d0192f}
html[data-tile="type"] .tile:hover .art{background:var(--grain-tile),#141414}
html[data-tile="type"] .tile:hover .tile .tc-big, html[data-tile="type"] .tile:hover .tc-big{color:#f4f3f0}
/* preview switch (temporary) */
.tswitch{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase}
.tswitch span{color:var(--muted);margin-right:4px}
.tswitch button{border:1px solid rgba(18,18,20,.3);background:rgba(255,255,255,.7);border-radius:999px;padding:7px 12px;font:inherit;letter-spacing:inherit;text-transform:inherit;color:#121214}
.tswitch button.on{background:#121214;color:#fff;border-color:#121214}
</style>

/* ---------- Sand renderer: dune crests, smooth tone ramp, per-pixel grain (no banding) ---------- */
const RAMP=[[0,[150,149,146]],[.25,[184,183,180]],[.5,[215,214,211]],[.78,[240,239,237]],[1,[253,253,252]]];
function ramp(t){
  for(let k=1;k<RAMP.length;k++){ if(t<=RAMP[k][0]){ const [a,ca]=RAMP[k-1],[b,cb]=RAMP[k], f=(t-a)/(b-a), e=f*f*(3-2*f);
    return [ca[0]+(cb[0]-ca[0])*e, ca[1]+(cb[1]-ca[1])*e, ca[2]+(cb[2]-ca[2])*e]; } }
  return RAMP[RAMP.length-1][1];
}
function sst(a,b,x){ const t=Math.max(0,Math.min(1,(x-a)/(b-a))); return t*t*(3-2*t); }
function sandDraw(cv, o={}){
  const w=cv.width, h=cv.height; if(w<2||h<2) return;
  let sd=(o.seed||1)*9301+49297; const rnd=()=>((sd=(sd*9301+49297)%233280)/233280);
  const H1=o.h1??.56, H2=o.h2??.8, A=o.amp??1, glow=o.glow??1, tiltK=o.tilt??.18;
  const p1=rnd()*6, p2=rnd()*6, p3=rnd()*6, f1=1.6+rnd()*1.2, f2=3.4+rnd()*2, f3=2.2+rnd()*1.5;
  const r1=new Float32Array(w), r2=new Float32Array(w), tl=new Float32Array(w);
  for(let x=0;x<w;x++){ const u=x/w;
    r1[x]=H1+A*(.055*Math.sin(u*f1*Math.PI+p1)+.022*Math.sin(u*f2*Math.PI+p2));
    r2[x]=H2+A*(.04*Math.sin(u*f3*Math.PI+p3)+.015*Math.sin(u*f2*1.7*Math.PI+p1));
    tl[x]=1+tiltK*(u-.5)*2; }
  const ctx=cv.getContext('2d'), im=ctx.createImageData(w,h), D=im.data, gAmt=o.grain??1;
  const P=o.pool, asp=w/h;
  for(let y=0;y<h;y++){ const v=y/h;
    for(let x=0;x<w;x++){
      const d1=v-r1[x], d2=v-r2[x];
      let t=(sst(-.32,.42,d1)*.72 + sst(-.06,.3,d2)*.34)*glow*tl[x];
      t+=Math.exp(-(d2*d2)/0.0009)*.05*glow;                       // soft lit rim on the near dune
      if(P){ const dx=(x/w-P.cx)*asp/P.rx, dy=(v-P.cy)/P.ry, m=Math.exp(-(dx*dx+dy*dy));
        t=t*(P.floor+(1-P.floor)*m)+m*P.lift; }      t=t<0?0:t>1?1:t;
      const c=ramp(t), n=(Math.random()-.5)*(6+6*t)*gAmt, i=(y*w+x)*4;
      D[i]=c[0]+n; D[i+1]=c[1]+n*.86; D[i+2]=c[2]+n*.72; D[i+3]=255;
    }
  }
  ctx.putImageData(im,0,0);
}
function paint(cv, hue, seed, dark){
  const d=Math.min(devicePixelRatio||1,2);
  cv.width=Math.max(2,Math.round(cv.offsetWidth*d)); cv.height=Math.max(2,Math.round(cv.offsetHeight*d));
  const r=(seed*7919)%100/100;
  sandDraw(cv,{seed, h1:.34+r*.24, h2:.66+r*.16, amp:1.3, glow:dark?1.05:1.15, tilt:(r-.5)*.6, grain:.9});
}

function wallDraw(cv){
  // Soft studio light on the wheel: a broad key light centred just above the cards, a faint shaft from above with a
  // very wide feather (no hard cone edges), and a gentle pool on the floor. Edges settle into light silver, not grey.
  const w=cv.width, h=cv.height, asp=w/h, ctx=cv.getContext('2d'), im=ctx.createImageData(w,h), D=im.data;
  const cyP=Math.min(.92,LIGHT.cy+.01);                                  // floor line under the wheel
  const r=vp.getBoundingClientRect(), cyC=(r.top+r.height*.44)/innerHeight; // middle of the cards
  const half=Math.min(.46,Math.max(.22,((typeof W==='number'?W:300)*1.1)/innerWidth)); // light width, as a share of screen width
  const kx=1/(half*1.9), fx=1/(half*1.7);
  for(let y=0;y<h;y++){ const v=y/h;
    const ky=(v-cyC)/.5, shaftV=Math.min(1,v/cyC)*(v>cyP? Math.exp(-(((v-cyP)/.08)**2)) : 1), py=(v-cyP)/.075;
    for(let x=0;x<w;x++){ const u=x/w, du=(u-.5);
      const key=Math.exp(-((du*kx)**2+ky*ky));                              // broad soft light
      const shaft=Math.exp(-((du/(half*(.55+.45*Math.min(1,v/cyP))))**2)*1.6)*shaftV;  // feathered shaft, widening downwards
      const pool=Math.exp(-((du*fx)**2+py*py));                             // light landing on the floor
      let t=.2+.34*key*Math.min(1,.35+v*1.1)+.24*pool;
      t*=1-.3*(du*2)**2;                                                   // gentle fall-off to the sides
      t=t>1?1:t;
      const c=ramp(t), n=(Math.random()-.5)*(4+5*t), i=(y*w+x)*4;
      D[i]=c[0]+n; D[i+1]=c[1]+n; D[i+2]=c[2]+n*1.02; D[i+3]=255;
    }

}

/* ---------- Hover: jitter + falling chips (modelled on the logo hover in the reference) ---------- */
const fx=document.getElementById('fx');
const CHIP_COLORS=[['#d0192f','#ffffff'],['#0b0b0c','#ffffff'],['#ffffff','#d0192f'],['#c9c8c4','#0b0b0c']];
function chipSVG([body,edge]){
  return `<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="${body}"/>
  <circle cx="20" cy="20" r="19" fill="none" stroke="${edge}" stroke-width="5" stroke-dasharray="7 7.9"/>
  <circle cx="20" cy="20" r="11.5" fill="none" stroke="${edge}" stroke-width="1.6" stroke-dasharray="2 2.5"/>
  <circle cx="20" cy="20" r="8" fill="${body}" stroke="${edge}" stroke-width="1"/></svg>`;
}
let hoverPanel=null, jitterT=null, lastSpawn=0, live=0;
function spawnChip(x,y,o={}){
  if(live>(o.cap||40)) return; live++;
  const el=document.createElement('div'); el.className='c';
  const size=(o.size||5)+Math.random()*(o.sizeVar||3); el.style.width=el.style.height=size+'px';
  el.innerHTML=chipSVG(CHIP_COLORS[Math.floor(Math.random()*CHIP_COLORS.length)]);
  fx.appendChild(el);
  const ox=o.ox||0, oy=o.oy||0, out=(o.out||14)+Math.random()*(o.outVar||18);
  const mx=x+ox*out, my=y+oy*out;                         // pushed out past the border
  const fall=(o.fall||60)+Math.random()*(o.fallVar||80), dx=ox*out*0.6+(Math.random()-.5)*14;
  const spin=(Math.random()<.5?-1:1)*(180+Math.random()*360);
  const dur=(o.dur||700)+Math.random()*(o.durVar||500);
  const a=el.animate([
    {transform:`translate(${x}px,${y}px) scale(.4) rotate(0deg)`,opacity:0},
    {transform:`translate(${mx}px,${my}px) scale(1) rotate(${spin*.25}deg)`,opacity:1,offset:.22},
    {transform:`translate(${mx+dx}px,${my+fall}px) scale(.9) rotate(${spin}deg)`,opacity:0}
  ],{duration:dur,delay:o.delay||0,easing:'cubic-bezier(.4,0,.85,.6)',fill:'backwards'});
  a.onfinish=()=>{ el.remove(); live--; };
}
// pick a point on the card's edge and send the chip outward from it
function spawnFromBorder(el,o={}){
  const r=el.getBoundingClientRect(), per=2*(r.width+r.height);
  let t=Math.random()*per, x, y, ox=0, oy=0;
  if(t<r.width){ x=r.left+t; y=r.top; oy=-1; }
  else if((t-=r.width)<r.height){ x=r.right; y=r.top+t; ox=1; }
  else if((t-=r.height)<r.width){ x=r.right-t; y=r.bottom; oy=1; }
  else { t-=r.width; x=r.left; y=r.bottom-t; ox=-1; }
  spawnChip(x,y,{...o,ox,oy});
}
function startJitter(el,amp=1){
  stopJitter(); hoverPanel=el;
  jitterT=setInterval(()=>{
    el.style.translate=`${(Math.random()-.5)*amp}px ${(Math.random()-.5)*amp}px`;
    el.style.rotate=`${(Math.random()-.5)*amp*0.08}deg`;
  },45);
}
function stopJitter(){
  clearInterval(jitterT); jitterT=null;
  if(hoverPanel){ hoverPanel.style.translate=''; hoverPanel.style.rotate=''; }
  hoverPanel=null;
}
/* ---------- Transition: the lit card shakes and spills a shower of chips ---------- */
let spinning=false;
function enterZone(i){
  if(spinning) return;
  if(reduce){ openDetail(i); return; }
  spinning=true; if(typeof snapT!=='undefined') snapT=performance.now();
  const el=panels[i], n=innerWidth<600?44:80;
  startJitter(el,1.6);
  fx.classList.add('front');                        // chips stay in front while the zone opens beneath them
  for(let k=0;k<n;k++) spawnFromBorder(el,{cap:300,size:5,sizeVar:4,out:18,outVar:40,fall:90,fallVar:160,dur:480,durVar:320,delay:Math.random()*180});
  // open in the middle of the spill: the page zooms in while chips are still falling over it
  setTimeout(()=>{ stopJitter(); openDetail(i); },200);
  // tidy up once the last chip has landed (max delay 180 + max duration 800)
  setTimeout(()=>{ fx.getAnimations({subtree:true}).forEach(a=>a.cancel()); fx.replaceChildren(); live=0; fx.classList.remove('front','clear'); spinning=false; },1050);
}

const LOOP_START=0.5, LOOP_END=17.0;   // 0:13 → 0:29.5 of the track (the embedded clip runs 0:12.5 → 0:30.5)
const music=document.getElementById('music'), mplay=document.getElementById('mplay');
const ICON_PLAY='<svg viewBox="0 0 24 24"><path d="M7.5 5.2v13.6l11-6.8z" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/></svg>', ICON_PAUSE='<svg viewBox="0 0 24 24"><path d="M6.5 5h3.4v14H6.5zM14.1 5h3.4v14h-3.4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>';
let actx=null, gain=null, src=null, bufP=null;
function setPlaying(on){ music.classList.toggle('playing',on); if(on) music.classList.add('played'); mplay.innerHTML=on?ICON_PAUSE:ICON_PLAY; mplay.setAttribute('aria-label',on?'Pause music':'Play music'); }
function loadBuffer(){
  if(bufP) return bufP;
  const bin=atob(TRACK_B64), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  bufP=actx.decodeAudioData(u.buffer); return bufP;
}
async function startMusic(){
  if(!actx){ const AC=window.AudioContext||window.webkitAudioContext; actx=new AC(); gain=actx.createGain(); gain.connect(actx.destination); }
  if(src){ await actx.resume(); fade(1); setPlaying(true); return; }
  const buf=await loadBuffer();
  src=actx.createBufferSource(); src.buffer=buf; src.loop=true; src.loopStart=LOOP_START; src.loopEnd=Math.min(LOOP_END,buf.duration);
  src.connect(gain); gain.gain.value=0; src.start(0,LOOP_START); fade(1); setPlaying(true);
}
function fade(to){ const t=actx.currentTime; gain.gain.cancelScheduledValues(t); gain.gain.setValueAtTime(gain.gain.value,t); gain.gain.linearRampToValueAtTime(to,t+0.35); }
document.getElementById('nudge').onclick=()=>mplay.click();
/* keep the scribble's arrow tip just above the play triangle, whatever the screen or font */
function aimNudge(){
  const nudge=document.getElementById('nudge'), ns=nudge.querySelector('svg'), ps=mplay.querySelector('svg');
  if(!ns||!ps||!nudge.offsetParent) return;
  const anim=nudge.style.animation; nudge.style.animation='none';
  const cs=getComputedStyle(nudge), sr=ns.getBoundingClientRect(), pr=ps.getBoundingClientRect();
  const k=sr.width/30, tipX=sr.left+24*k, tipY=sr.top+23.5*k;            // arrow tip in the scribble's drawing
  const mr=music.getBoundingClientRect();
  const wantX=pr.left+pr.width*(13/24), wantY=mr.top-3;                      // straight above the triangle, tip resting just over the player's edge
  nudge.style.right=(parseFloat(cs.right)-(wantX-tipX))+'px';
  nudge.style.bottom=(parseFloat(cs.bottom)-(wantY-tipY))+'px';
  nudge.style.animation=anim;
}
aimNudge(); addEventListener('resize',()=>requestAnimationFrame(aimNudge));
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(aimNudge);
document.getElementById('detail').addEventListener('error',e=>{ if(e.target.classList&&e.target.classList.contains('rv')) e.target.remove(); },true);
document.getElementById('detail').addEventListener('play',e=>{ if(e.target.tagName==='VIDEO' && music.classList.contains('playing')) mplay.click(); },true);
mplay.onclick=()=>{
  if(music.classList.contains('playing')){ fade(0); setPlaying(false); setTimeout(()=>{ if(!music.classList.contains('playing')) actx.suspend(); },400); }
  else startMusic().catch(()=>setPlaying(false));
};

addEventListener('resize',layout);
/* ---------- Beam + dust (one canvas, screen-blended over the sand) ---------- */
const lcv=document.getElementById('light'), lctx=lcv.getContext('2d');
const beamCv=document.createElement('canvas');
let litMax=1, snapT=-1e9, motes=[];
function aimLight(){
  const r=vp.getBoundingClientRect();
  LIGHT.cy=(r.top+r.height*.47+(H||300)*.5)/innerHeight;     // where the wheel meets the sand
  LIGHT.cy=Math.min(.9,Math.max(.45,LIGHT.cy));
}
function beamHalf(yFrac){ // half-width of the cone, as a fraction of screen width
  const top=.045, bot=Math.min(.34, .2*innerHeight/innerWidth*1.6+.12);
  return top+(bot-top)*Math.min(1,yFrac/LIGHT.cy);
}
function buildBeam(){
  const d=Math.min(devicePixelRatio||1,1.5), W=innerWidth, Hh=innerHeight;
  lcv.width=Math.round(W*d); lcv.height=Math.round(Hh*d); lcv.style.width=W+'px'; lcv.style.height=Hh+'px';
  beamCv.width=lcv.width; beamCv.height=lcv.height;
  const g=beamCv.getContext('2d'), w=beamCv.width, h=beamCv.height, cx=w*LIGHT.cx, yEnd=h*(LIGHT.cy+.04);
  g.clearRect(0,0,w,h);
  for(let k=0;k<10;k++){                       // stacked cones = soft edges without blur filters
    const spread=1+k*.08, a=.04;
    const t0=beamHalf(0)*w*spread, t1=beamHalf(LIGHT.cy)*w*spread;
    const grad=g.createLinearGradient(0,0,0,yEnd);
    grad.addColorStop(0,`rgba(255,255,255,${a*1.5})`); grad.addColorStop(.6,`rgba(255,255,255,${a})`); grad.addColorStop(.92,'rgba(255,255,255,0)');
    g.fillStyle=grad; g.beginPath(); g.moveTo(cx-t0,0); g.lineTo(cx+t0,0); g.lineTo(cx+t1,yEnd); g.lineTo(cx-t1,yEnd); g.closePath(); g.fill();
  }
  const lamp=g.createRadialGradient(cx,0,0,cx,0,w*.16); lamp.addColorStop(0,'rgba(255,255,255,.55)'); lamp.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=lamp; g.fillRect(0,0,w,h*.4);
  motes=Array.from({length:Math.round(36+W/40)},()=>({xf:(Math.random()*2-1), y:Math.random(), r:.5+Math.random()*1.3, vy:(Math.random()*.6+.2)*(Math.random()<.5?-1:1)*.00045, ph:Math.random()*6.28, sp:.5+Math.random()*1.5}));
}
function lightLoop(now){
  const w=lcv.width, h=lcv.height, d=w/innerWidth;
  lctx.clearRect(0,0,w,h);
  const zone=document.body.classList.contains('zone-open');
  if(!zone){
    let I=1, narrow=0;
    if(LIGHT.react){
      I=.62+.38*litMax-Math.min(.25,Math.abs(vel)*.03);
      const st=(now-snapT)/700; if(st>=0&&st<1){ const e=Math.sin(st*Math.PI); narrow=e*.3; I+=e*.9; }
    }
    if(LIGHT.beam){
      lctx.globalAlpha=Math.max(0,Math.min(2,I));
      const sw=w*(1-narrow), sx=(w-sw)/2;
      lctx.drawImage(beamCv,0,0,w,h,sx,0,sw,h); if(I>1){ lctx.globalAlpha=I-1; lctx.drawImage(beamCv,0,0,w,h,sx,0,sw,h); }
      lctx.globalAlpha=1;
    }
    if(LIGHT.dust){
      const t=now/1000;
      for(const m of motes){
        if(!reduce){ m.y+=m.vy; m.xf+=Math.sin(t*m.sp+m.ph)*.0009; if(m.y<0)m.y+=LIGHT.cy; if(m.y>LIGHT.cy)m.y-=LIGHT.cy; }
        const half=beamHalf(m.y)*(1-narrow), x=(LIGHT.cx+m.xf*half)*w, y=m.y*h;
        const edge=Math.max(0,1-Math.abs(m.xf)**3), tw=.45+.55*Math.sin(t*m.sp*1.7+m.ph)**2;
        lctx.fillStyle=`rgba(120,120,128,${(.55*edge*tw*Math.min(1.4,I)).toFixed(3)})`;
        lctx.beginPath(); lctx.arc(x,y,m.r*d,0,6.283); lctx.fill();
      }
    }
  }
  requestAnimationFrame(lightLoop);
}

Object.keys(LIGHT).forEach(k=>document.documentElement.classList.toggle('l-'+k,LIGHT[k]===true));

document.documentElement.dataset.foot='list'; document.documentElement.dataset.tile='cover';
layout(); aimLight(); drawBackdrop(); buildBeam(); if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ layout(); aimLight(); drawBackdrop(); buildBeam(); }); requestAnimationFrame(frame); requestAnimationFrame(lightLoop);
